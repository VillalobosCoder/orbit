services:
  postgres:
    image: postgres:18-alpine
    container_name: orbit_db
    restart: none
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: orbit_db
    ports:
      - "5432:5432"
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: